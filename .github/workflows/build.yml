name: Build Windows EXE

on:
  workflow_dispatch:   # 仅手动触发：Actions 页面 → Run workflow

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build (build_exe.bat)
        shell: cmd
        run: build_exe.bat

      - name: Verify output
        shell: pwsh
        run: |
          if (!(Test-Path dist/ScreenDimmer.exe)) { throw "exe not produced" }
          Get-Item dist/ScreenDimmer.exe | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenDimmer
          path: dist/ScreenDimmer.exe
          if-no-files-found: error
          retention-days: 300
